project:
  type: website
  output-dir: _site
  resources:
    - portal-build.js
  render:
    - index.qmd
    - selection.qmd
    - paper.qmd
    - wave_analysis.ipynb
    - judge_comparison.ipynb
    - reviewer.ipynb
    - reviewers.qmd
    - research-updates.qmd

# Use the committed cell outputs — do NOT re-execute on render (the systems
# telemetry needs the specific node; re-run locally with build-analysis-site.sh).
execute:
  enabled: false

website:
  title: "CEOps"
  site-url: https://dragoshont.github.io/apprenticeops/
  favicon: favicon.svg
  description: >-
    CEOps — a benchmark and paper on whether small, locally sovereign model
    deployments are good enough at a cost commodity offline hardware can
    sustain. First release: ApprenticeOps (quality × safety × energy).
  reader-mode: true
  search:
    location: navbar
    type: overlay
    limit: 12
    collapse-after: 1
    show-item-context: tree
  navbar:
    collapse-below: xl
    left:
      - text: "Overview"
        href: index.qmd
      - text: "Evidence"
        menu:
          - text: "Selection"
            href: selection.qmd
          - text: "Selection results"
            href: wave_analysis.ipynb
          - text: "Judge agreement"
            href: judge_comparison.ipynb
      - text: "Method & paper"
        href: paper.qmd
      - text: "Reproduce"
        menu:
          - text: "Reviewer query lab"
            href: reviewer.ipynb
          - text: "Machine-readable exports"
            href: https://github.com/dragoshont/apprenticeops/tree/main/data/site
          - text: "Reproduction guide"
            href: https://github.com/dragoshont/apprenticeops/blob/main/REPRODUCE.md
      - text: "Review"
        href: reviewers.qmd
      - text: "Research updates"
        href: research-updates.qmd
    tools:
      - icon: github
        href: https://github.com/dragoshont/apprenticeops
        aria-label: "ApprenticeOps source on GitHub"
  page-footer:
    left: "Evidence: analysis v1 · corrected 2026-07-10"
    center: "Code Apache-2.0 · dataset mixed rights · human-guided, AI-assisted"
    right:
      - text: "Build provenance"
        href: build.json

format:
  html:
    theme:
      light: [cosmo, ceops.scss]
      dark: [cosmo, ceops.scss]
    css: portal.css
    toc: true
    toc-depth: 3
    toc-expand: true
    code-fold: true
    code-tools: false
    code-summary: "show code"
    fig-align: center
    df-print: paged
    smooth-scroll: true
    include-after-body: portal-build.html
