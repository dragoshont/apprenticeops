name: Publish analysis site

# Render the Quarto analysis site (docs/analysis) and publish it to Cloudflare Pages.
# The verification job executes isolated notebook copies against manifest-bound
# evidence. The render then uses committed outputs because `_quarto.yml`
# sets `execute: enabled: false`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege: the Cloudflare deploy needs only repo read. The Pages token is
# a GitHub Actions secret (CLOUDFLARE_API_TOKEN), not a GITHUB_TOKEN permission.
permissions:
  contents: read

# One deployment at a time; let an in-flight deploy finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify-analysis-v1:
    if: github.ref == 'refs/heads/main'
    # Cached notebook/PNG artifacts are byte- and pixel-locked to the macOS arm64
    # correction environment. Portable schema/claim checks still run here; only
    # exact artifact reproduction needs the reference platform.
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify archival history
        run: git cat-file -e '36fc989^{commit}'

      - name: Verify reference platform
        run: test "$(uname -s)/$(uname -m)" = "Darwin/arm64"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked analysis dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --require-hashes -r requirements-lock.txt

      - name: Audit analysis contracts, claims, links, and privacy
        run: |
          .venv/bin/python scripts/validate-analysis-environment.py
          .venv/bin/python scripts/audit-tool-licenses.py
          .venv/bin/python scripts/audit-paper-data.py
          .venv/bin/python scripts/audit-paper-claims.py
          .venv/bin/python scripts/check-doc-links.py
          .venv/bin/python scripts/privacy-scan.py
          .venv/bin/python scripts/validate-croissant.py --official
          .venv/bin/python scripts/test-portal.py

      - name: Warm reference plotting cache
        run: .venv/bin/python -c 'import matplotlib.pyplot'

      - name: Reproduce analysis v1 without mutation
        run: PY=.venv/bin/python scripts/build-analysis-site.sh --verify

  build-and-deploy:
    needs: verify-analysis-v1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site (committed outputs; execute disabled)
        run: quarto render docs/analysis

      - name: Stamp and verify portal provenance
        env:
          PORTAL_COMMIT: ${{ github.sha }}
          PORTAL_BUILD_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/write-portal-build.py \
            --site-dir docs/analysis/_site \
            --commit "$PORTAL_COMMIT" \
            --built-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --workflow-run-url "$PORTAL_BUILD_URL"
          python3 scripts/verify-portal.py \
            --site-dir docs/analysis/_site \
            --expected-commit "$PORTAL_COMMIT"

      - name: Add Cloudflare Pages cache headers
        run: cp deploy/cloudflare/_headers docs/analysis/_site/_headers

      - name: Deploy to Cloudflare Pages
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=ceops --branch=main --commit-dirty=true

      - name: Verify deployed portal truth
        run: |
          python3 scripts/verify-portal.py \
            --base-url "${{ steps.deployment.outputs.deployment-url }}" \
            --expected-commit "${{ github.sha }}" \
            --attempts 12 \
            --delay 10
